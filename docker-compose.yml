services:
  omnislash:
    build:
      context: .
      args:
        VERSION: "${OMNISLASH_VERSION:-1.0.0}"
    image: omnislash:${OMNISLASH_VERSION:-1.0.0}
    container_name: omnislash
    command:
      - serve
      - -config
      - /etc/omnislash/config.json
      - -listen
      - 0.0.0.0:3128
      - -stats
      - 0.0.0.0:9090
    ports:
      - "127.0.0.1:3128:3128"
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/omnislash", "healthcheck", "-url", "http://127.0.0.1:9090/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Для своего конфига раскомментируйте volume и положите файл рядом с compose.
    # volumes:
    #   - ./config.local.json:/etc/omnislash/config.json:ro
