name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt  # no requirements.txt in this repo yet

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...' locally."
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run

      - name: Go Test
        run: go test ./... -race -count=1 -timeout 300s

      - name: Python Tests
        run: python3 -m unittest discover -s research -p "test_*.py"
